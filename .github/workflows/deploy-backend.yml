name: Deploy Serverless Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS (prod)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # TEMP: remove after OIDC works — prints token claims (sub/ref/aud) for trust-policy debugging
      - name: Debug OIDC token claims
        run: |
          set -euo pipefail
          echo "Role ARN secret set? $([ -n "${{ secrets.AWS_ROLE_ARN }}" ] && echo yes || echo NO_EMPTY)"
          echo "Ref: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"
          REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          TOKEN=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${REQUEST_URL}" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$((4 - ${#PAYLOAD} % 4))
          if [ "$PAD" -lt 4 ]; then PAYLOAD="${PAYLOAD}$(printf '%*s' "$PAD" | tr ' ' '=')"; fi
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub, aud, ref, repository, job_workflow_ref, environment}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Install dependencies
        run: npm ci

      - name: Deploy Serverless stack
        working-directory: backend
        run: npx serverless deploy --stage prod --region us-east-1
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          # Ensure Serverless/AWS SDK use the OIDC session, not a missing local profile
          AWS_PROFILE: ''
          AWS_SDK_LOAD_CONFIG: '0'
